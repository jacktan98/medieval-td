<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<!-- The tab icon: the barracks' crossed swords on the game's own button
     plate, composited from the two files rather than drawn again. It is the
     one piece of art here that has to read at 16px — see the note in
     assets/ui/README.md before replacing it. -->
<link rel="icon" type="image/png" href="../assets/ui/Favicon.png">

<!-- ADDED TO A HOME SCREEN, iOS ignores the tag above entirely. It looks for
     apple-touch-icon, and with none it falls back to the first letter of the
     title — which is why this game was a letter M on a phone.

     A different drawing rather than the same file scaled up, and it has to be:
     iOS composites any transparency onto black and then applies its own
     rounded mask, so the favicon's disc-on-a-clear-ground would arrive as a
     disc in a black box. This one is opaque edge to edge on the board's own
     grass, with the swords held inside 14% of the edge so the corners iOS
     rounds off take nothing with them. 180 x 180 is the largest iOS asks for
     and it scales the rest itself. -->
<link rel="apple-touch-icon" sizes="180x180" href="../assets/ui/Apple_Touch_Icon.png">

<!-- The label under the icon. Without this iOS uses the <title>, and the title
     carries a build marker no player should be reading off their home screen. -->
<meta name="apple-mobile-web-app-title" content="Medieval TD">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #17190F;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap { display: grid; place-items: center; height: 100%; }
  #name {
    position: fixed;
    box-sizing: border-box;
    border: 0;
    border-radius: 8px;
    background: rgba(240, 230, 210, 0.08);
    color: #F0E6D2;
    font: 600 18px system-ui, sans-serif;
    padding: 0 14px;
    outline: none;
  }
  #name::placeholder { color: rgba(240, 230, 210, 0.35); }
  #name[hidden] { display: none; }
  canvas {
    display: block;
    width: min(100vw, 177.78vh);
    width: min(100dvw, 177.78dvh);
    aspect-ratio: 16 / 9;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>

  <!-- THE ONE PIECE OF HTML THE GAME USES, and it is here because a canvas cannot
       take typing. Everything else in this project is drawn; a name field is the
       one control where the right answer is the browser's own — it brings up a
       phone's keyboard, it handles a caret and selection and paste, and none of
       that is worth reimplementing on a canvas for one line of text.

       It is hidden until the certificate screen is up, and main.js is what
       positions it over the box the renderer draws. -->
  <input id="name" type="text" maxlength="28" autocomplete="name"
         placeholder="Type your name" aria-label="Your name" hidden>

  <!-- No import map and no cache busting, unlike the big game's page. This one is
       five modules and is not deployed on its own cadence: it rides along with
       whatever push carried it, and a hard reload is the whole remedy. Add the
       import map from ../index.html if that ever stops being true. -->
  <script type="module">import './src/main.js';</script>
</body>
</html>
