<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval TD — M1</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #23201c;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;
    width: 100%;
    image-rendering: pixelated;
    display: block;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <script type="module" src="./src/main.js?v=4"></script>
</body>
</html>
