<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Tower Defense</title>
<!-- The tab icon: the barracks' crossed swords on the game's own button
     plate, composited from the two files rather than drawn again. It is the
     one piece of art here that has to read at 16px — see the note in
     assets/ui/README.md before replacing it. -->
<link rel="icon" type="image/png" href="assets/ui/Favicon.png">

<!-- ADDED TO A HOME SCREEN, iOS ignores the tag above entirely. It looks for
     apple-touch-icon, and with none it falls back to the first letter of the
     title — which is why this game was a letter M on a phone.

     A different drawing rather than the same file scaled up, and it has to be:
     iOS composites any transparency onto black and then applies its own
     rounded mask, so the favicon's disc-on-a-clear-ground would arrive as a
     disc in a black box. This one is opaque edge to edge on the board's own
     grass, with the swords held inside 14% of the edge so the corners iOS
     rounds off take nothing with them. 180 x 180 is the largest iOS asks for
     and it scales the rest itself. -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/ui/Apple_Touch_Icon.png">

<!-- The label under the icon. Without this iOS uses the <title>, which is too long
     to fit under a home-screen icon. -->
<meta name="apple-mobile-web-app-title" content="Medieval TD">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #23201c;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  /* The whole board must be on screen. It is a fixed 960x540 world with plots
     in the corners, so anything cut off is a plot you cannot build on.

     Sized from whichever axis actually binds, rather than from the width with
     a max-height to catch the overflow: `width: 100%` is a DEFINITE width, so
     aspect-ratio derives the height from it and `max-height` never shrinks the
     width back. On a 844x390 phone in landscape that made the canvas 844x475
     inside a 390-tall window, and body{overflow:hidden} quietly ate the bottom
     18% of the map — the two lowest plots and the bottom of the road. It read
     as the map being zoomed in.

     177.78vh is 100vh x 16/9, the width the board would need if height were the
     limit. The dvh line repeats it in dynamic viewport units so a phone's
     retracting address bar is accounted for; browsers without dvh ignore it and
     keep the vh line above. */
  canvas {
    display: block;
    width: min(100vw, 177.78vh);
    width: min(100dvw, 177.78dvh);
    aspect-ratio: 16 / 9;
  }
  /* TURN THE PHONE SIDEWAYS, at the owner's word: a phone held upright shows the
     board as a strip across the middle, too small to tap. Only on a touch screen
     held upright — a narrow desktop window is not a phone — and over everything,
     with a phone drawn turning. The battle pauses under it (src/main.js). In the
     game's own colours and Lobster, which src/overview.js loads for the page. */
  #turn {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #23201c;
    color: #FFEFD4;
    font-family: Lobster, Georgia, serif;
    text-align: center;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 0 32px;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #turn { display: flex; }
  }
  #turn svg { width: 96px; height: 96px; animation: turn 2.4s ease-in-out infinite; }
  #turn p { margin: 0; font-size: 30px; line-height: 1.25; text-shadow: 0 2px 0 #0e0c0a; }
  #turn small { font-size: 19px; opacity: 0.75; }
  @keyframes turn {
    0%, 20% { transform: rotate(0deg); }
    45%, 75% { transform: rotate(-90deg); }
    100% { transform: rotate(0deg); }
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="turn">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <rect x="30" y="10" width="36" height="76" rx="7" fill="none" stroke="#FFEFD4" stroke-width="5"/>
      <line x1="42" y1="76" x2="54" y2="76" stroke="#FFEFD4" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <p>Turn your phone sideways to play<br><small>The game is played in landscape</small></p>
  </div>

  <!-- Cache busting. GitHub Pages serves static files with max-age=600, and a
       ?v on main.js alone never helped: the modules it imports keep their own
       URLs, so edits to render.js or data/towers.js stayed invisible for ten
       minutes and looked like broken code.

       This maps every module to a versioned URL in one go. The version is the
       current minute, so a push is always visible on the next reload and a
       play session still reuses its modules. For fixed versions instead, set
       stamp to a number you bump by hand.

       Adding a file under src/ means adding it here. tools/check-modules.mjs
       fails if you forget. -->
  <script>
    (function () {
      var stamp = Math.floor(Date.now() / 60000);
      // THE PUBLIC BUILD fixes it here instead, with each file's own fingerprint in
      // window.__hashes: see tools/itch.mjs, which rewrites this line. Do not move it.
      //@@BUILD@@
      // AND THE SAME STAMP FOR THE ARTWORK AND THE AUDIO, which fetch themselves
      // from inside the modules and had no version at all — see `versioned` in
      // src/assets.js. Published rather than recomputed there so one reload gets
      // one version for everything, even across a minute boundary.
      window.__stamp = stamp;
      // THE FONT, ASKED FOR AT ONCE rather than once the modules have arrived: the
      // loading screen's words wait for it (src/main.js), so the sooner it lands the
      // sooner they show. The same URL src/overview.js loads it from, so it is one fetch.
      var font = document.createElement('link');
      font.rel = 'preload'; font.as = 'font'; font.type = 'font/woff2'; font.crossOrigin = 'anonymous';
      font.href = 'assets/fonts/Lobster-Regular.woff2?v=' + ((window.__hashes && window.__hashes['assets/fonts/Lobster-Regular.woff2']) || stamp);
      document.head.appendChild(font);
      var mods = [
        'main', 'assets', 'enemies', 'tint', 'flag', 'towers', 'projectiles', 'waves',
        'render', 'input', 'overview', 'motion', 'life', 'menu', 'book', 'newfoe', 'upgrades', 'upgradepage', 'achievements', 'achievepage', 'stats', 'settings', 'titlepage', 'admin', 'score', 'smoke', 'units', 'villagers', 'corpses', 'bombs', 'blood', 'impacts', 'gesture', 'ground', 'select', 'audio', 'route', 'level', 'status', 'crew', 'holy', 'desert', 'tutorial', 'analytics', 'rng', 'replay', 'ending', 'data/ui',
        'data/overview', 'data/level00', 'data/level01', 'data/level02', 'data/level03', 'data/level04', 'data/level05', 'data/level06', 'data/level07', 'data/level08','data/level09','data/level10','data/level11', 'data/level12', 'data/level13', 'data/level14', 'data/level15', 'data/level16', 'data/level17', 'data/level18', 'data/abilities', 'data/armor', 'data/banners', 'data/crew', 'data/difficulty', 'data/status', 'data/towers', 'data/waves', 'data/upgrades', 'data/story', 'data/bossfx', 'data/ending', 'data/achievements'
      ];
      var imports = {};
      for (var i = 0; i < mods.length; i++) {
        var file = 'src/' + mods[i] + '.js';
        imports['./' + file] = './' + file + '?v=' + ((window.__hashes && window.__hashes[file]) || stamp);
      }
      var tag = document.createElement('script');
      tag.type = 'importmap';
      tag.textContent = JSON.stringify({ imports: imports });
      document.head.appendChild(tag);
    })();
  </script>
  <script type="module">import './src/main.js';</script>
</body>
</html>
