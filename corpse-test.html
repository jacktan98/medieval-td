<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Medieval TD — corpse placement</title>
<!-- Open this after uploading anything to assets/dead. It draws every death
     pose the game knows about, both facings, and one mid-fade, with the LIVING
     figure of each directly above it for scale — no wave to play and no kill to
     wait for. The cyan crosshair is the spot the man died on: a body must lie
     ACROSS its cross, not beside it. If one is off, the pose was drawn in the
     wrong place on its 512 canvas; assets/dead/README.md has the foot points. -->
<style>body{margin:0;background:#23201c}canvas{display:block}</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
  (function () {
    var stamp = Math.floor(Date.now() / 60000);
    var mods = [
      'main', 'assets', 'enemies', 'towers', 'projectiles', 'waves',
      'render', 'input', 'menu', 'book', 'admin', 'score', 'smoke', 'units', 'corpses', 'blood', 'impacts', 'ground', 'select', 'audio', 'route', 'level', 'data/ui',
      'data/level01', 'data/level02', 'data/level03', 'data/difficulty', 'data/towers', 'data/waves'
    ];
    var imports = {};
    for (var i = 0; i < mods.length; i++) {
      imports['./src/' + mods[i] + '.js'] = './src/' + mods[i] + '.js?v=' + stamp;
    }
    var tag = document.createElement('script');
    tag.type = 'importmap';
    tag.textContent = JSON.stringify({ imports: imports });
    document.head.appendChild(tag);
  })();
</script>
<script type="module">
import { loadArt } from './src/assets.js';
import { draw } from './src/render.js';
import { enemyTypes } from './src/data/waves.js';
import { barracks } from './src/data/towers.js';
import { CORPSE_LIFE } from './src/corpses.js';
import { poolFor, splat } from './src/blood.js';

const spear = barracks[0].soldier;
const spear2 = barracks[1].soldier;
const spear3 = barracks[2].soldier;

// One column per figure that can die. Five of them since tier 3 stopped sharing
// tier 2's drawing, so the columns are tighter than they were.
const COL = [110, 300, 490, 680, 870];
const [militia, heavy, s1, s2, s3] = COL;

// A living figure beside each body at the same spot, so size and ground line can
// be compared directly, plus one of each facing and one mid-fade.
const state = {
  gold: 0, lives: 0, waveIndex: 0, spawned: 0, timer: 0,
  started: true,          // no title screen on a test page
  resting: false, menu: null, result: null, towers: [], shots: [], hits: [], splats: [],
  enemies: [
    { def: enemyTypes.light_inf, x: militia, y: 150, hp: 1, maxHp: 1, t: 0, bobAmp: 1, face: 1, thrust: 0 },
    { def: enemyTypes.heavy_inf, x: heavy,   y: 150, hp: 1, maxHp: 1, t: 0, bobAmp: 1, face: 1, thrust: 0 }
  ],
  units: [
    { def: spear,  x: s1, y: 150, hp: 1, maxHp: 1, face: 0, thrust: 0, respawn: 0, tower: null },
    { def: spear2, x: s2, y: 150, hp: 1, maxHp: 1, face: 0, thrust: 0, respawn: 0, tower: null },
    { def: spear3, x: s3, y: 150, hp: 1, maxHp: 1, face: 0, thrust: 0, respawn: 0, tower: null }
  ],
  corpses: [
    { def: enemyTypes.light_inf, x: militia, y: 300, face: 1,  life: CORPSE_LIFE, pool: poolFor() },
    { def: enemyTypes.light_inf, x: militia, y: 420, face: -1, life: CORPSE_LIFE, pool: poolFor() },
    { def: enemyTypes.heavy_inf, x: heavy,   y: 300, face: 1,  life: CORPSE_LIFE, pool: poolFor() },
    { def: enemyTypes.heavy_inf, x: heavy,   y: 420, face: -1, life: CORPSE_LIFE, pool: poolFor() },
    { def: spear,                x: s1, y: 300, face: 1,  life: CORPSE_LIFE, pool: poolFor() },
    { def: spear,                x: s1, y: 420, face: -1, life: 0.25, pool: poolFor() },
    { def: spear2,               x: s2, y: 300, face: 1,  life: CORPSE_LIFE, pool: poolFor() },
    { def: spear2,               x: s2, y: 420, face: -1, life: CORPSE_LIFE, pool: poolFor() },
    { def: spear3,               x: s3, y: 300, face: 1,  life: CORPSE_LIFE, pool: poolFor() },
    { def: spear3,               x: s3, y: 420, face: -1, life: CORPSE_LIFE, pool: poolFor() }
  ]
};

const ctx = document.getElementById('game').getContext('2d');
await loadArt();
// A handful of spatter around each living figure, so the hit effect is on the
// same page as the pools rather than needing a fight to see it. Third argument
// is the victim's feet, which is what the renderer sorts the spatter by.
for (const f of [...state.enemies, ...state.units])
  for (let i = 0; i < 5; i++) splat(state, f.x, f.y - 10, f.y);
draw(ctx, state);

// Crosshairs on every anchor: the body must lie ACROSS its cross, not beside it.
ctx.strokeStyle = '#00E5FF';
ctx.lineWidth = 1;
for (const c of [...state.corpses, ...state.enemies, ...state.units]) {
  ctx.beginPath();
  ctx.moveTo(c.x - 9, c.y); ctx.lineTo(c.x + 9, c.y);
  ctx.moveTo(c.x, c.y - 9); ctx.lineTo(c.x, c.y + 9);
  ctx.stroke();
}

ctx.fillStyle = '#F0E6D2';
ctx.font = '13px system-ui, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('alive', 40, 155);
ctx.fillText('dead, facing right', 70, 275);
ctx.fillText('dead, facing left', 70, 395);
['militia', 'heavy', 'spear T1', 'spear T2', 'knight T3'].forEach((n, i) => ctx.fillText(n, COL[i], 195));
ctx.textAlign = 'left';
window.ready = true;
</script>
</body>
</html>
